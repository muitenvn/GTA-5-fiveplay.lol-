name: Build Android APK and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Keystores for CI
      run: |
        keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        keytool -genkeypair -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload Key,O=Android,C=US"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug and Release APK with Gradle
      env:
        STORE_PASSWORD: android
        KEY_PASSWORD: android
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug assembleRelease
        else
          gradle assembleDebug assembleRelease
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fiveplay-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fiveplay-release-apk
        path: app/build/outputs/apk/release/

    - name: Publish Release on Tag Push
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
